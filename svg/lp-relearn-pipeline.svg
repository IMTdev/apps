<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" role="img" aria-label="Pipeline: flow by stages">
  <defs>
    <style>
      .pipeline-dot { fill: #1b4ed8; }
      .pipeline-dot-left { animation: pipeline-dot-left 4.5s linear infinite; }
      .pipeline-dot-mid { animation: pipeline-dot-mid 4.5s linear infinite; }
      .pipeline-dot-right { animation: pipeline-dot-right 4.5s linear infinite; }
      @keyframes pipeline-dot-left { 0%, 33% { opacity: 1; } 34%, 100% { opacity: 0; } }
      @keyframes pipeline-dot-mid { 0%, 33% { opacity: 0; } 34%, 66% { opacity: 1; } 67%, 100% { opacity: 0; } }
      @keyframes pipeline-dot-right { 0%, 66% { opacity: 0; } 67%, 100% { opacity: 1; } }
    </style>
  </defs>
  <rect x="10" y="40" width="20" height="20" fill="none" stroke="#4a5768" stroke-width="1.5"/>
  <rect x="40" y="40" width="20" height="20" fill="none" stroke="#4a5768" stroke-width="1.5"/>
  <rect x="70" y="40" width="20" height="20" fill="none" stroke="#4a5768" stroke-width="1.5"/>
  <line x1="30" y1="50" x2="40" y2="50" stroke="#4a5768"/>
  <line x1="60" y1="50" x2="70" y2="50" stroke="#4a5768"/>
  <circle class="pipeline-dot pipeline-dot-left" cx="20" cy="50" r="4"/>
  <circle class="pipeline-dot pipeline-dot-mid" cx="50" cy="50" r="4"/>
  <circle class="pipeline-dot pipeline-dot-right" cx="80" cy="50" r="4"/>
</svg>
