<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>imt.dev — варианты логотипа</title>
  <style>
    body { font-family: system-ui, sans-serif; background: #f8f9fa; padding: 2rem; }
    h1 { font-size: 1rem; color: #4a5768; margin-bottom: 0.5rem; }
    .row { display: flex; flex-wrap: wrap; gap: 2rem; align-items: flex-start; margin-bottom: 2rem; }
    .card { background: #fff; padding: 1.5rem; border-radius: 8px; box-shadow: 0 1px 3px rgba(0,0,0,.08); }
    .card img, .card object { display: block; height: 56px; width: auto; }
  </style>
</head>
<body>
  <h1>Вариант 1: появление букв</h1>
  <div class="row">
    <div class="card">
      <object data="imt-dev-logo.svg" type="image/svg+xml" id="v1"></object>
    </div>
  </div>
  <p style="font-size: 0.85rem; color: #737373;">Перезагрузи страницу, чтобы увидеть анимацию появления букв.</p>

  <h1>Вариант 2: дыхание скобок</h1>
  <div class="row">
    <div class="card">
      <object data="imt-dev-logo-v2.svg" type="image/svg+xml"></object>
    </div>
  </div>

  <h1>Вариант 3: точка пульсирует</h1>
  <div class="row">
    <div class="card">
      <object data="imt-dev-logo-v3.svg" type="image/svg+xml"></object>
    </div>
  </div>

  <h1>Вариант 4: скобки входят с боков</h1>
  <div class="row">
    <div class="card">
      <object data="imt-dev-logo-v4.svg" type="image/svg+xml"></object>
    </div>
  </div>

  <h1>Цветовые варианты</h1>
  <div class="row">
    <div class="card">
      <p style="margin:0 0 0.5rem 0; font-size:0.75rem; color:#737373;">Скобки синие, текст тёмный, точка синяя</p>
      <object data="imt-dev-logo-blue-brackets.svg" type="image/svg+xml"></object>
    </div>
    <div class="card">
      <p style="margin:0 0 0.5rem 0; font-size:0.75rem; color:#737373;">Всё синее</p>
      <object data="imt-dev-logo-all-blue.svg" type="image/svg+xml"></object>
    </div>
  </div>
</body>
</html>
