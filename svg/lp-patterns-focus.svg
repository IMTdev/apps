<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" role="img" aria-label="Focus: D>:CA">
  <defs>
    <style>
      .focus-center { animation: focus-pulse 1.5s ease-in-out infinite; }
      @keyframes focus-pulse { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.2); } }
    </style>
  </defs>
  <circle cx="50" cy="50" r="35" fill="none" stroke="#4a5768" stroke-width="1" opacity="0.3"/>
  <line x1="50" y1="20" x2="50" y2="40" stroke="#1b4ed8" stroke-width="2"/>
  <line x1="50" y1="60" x2="50" y2="80" stroke="#1b4ed8" stroke-width="2"/>
  <line x1="20" y1="50" x2="40" y2="50" stroke="#1b4ed8" stroke-width="2"/>
  <line x1="60" y1="50" x2="80" y2="50" stroke="#1b4ed8" stroke-width="2"/>
  <circle class="focus-center" cx="50" cy="50" r="5" fill="#1b4ed8"/>
</svg>
