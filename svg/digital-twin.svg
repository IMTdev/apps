<svg width="800" height="800" viewBox="0 0 800 800" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      @keyframes spin {
        0% { transform: scaleX(1); }
        50% { transform: scaleX(0.1); }
        100% { transform: scaleX(1); }
      }
      
      @keyframes sync {
        0%, 100% { opacity: 0.5; }
        50% { opacity: 1; }
      }
    </style>
  </defs>
  
  <rect width="800" height="800" fill="#FFFFFF"/>
  
  <!-- Divider -->
  <line x1="400" y1="100" x2="400" y2="700" stroke="#E5E5E5" stroke-dasharray="8 8"/>
  
  <!-- Physical Twin (Left) -->
  <g transform="translate(200, 400)">
    <g style="animation: spin 4s ease-in-out infinite;">
      <rect x="-80" y="-120" width="160" height="240" fill="#4a5768"/>
      <circle cx="0" cy="-160" r="40" fill="#4a5768"/>
    </g>
  </g>
  
  <!-- Digital Twin (Right) -->
  <g transform="translate(600, 400)">
    <g style="animation: spin 4s ease-in-out infinite;">
      <rect x="-80" y="-120" width="160" height="240" fill="none" stroke="#1b4ed8" stroke-width="4"/>
      <circle cx="0" cy="-160" r="38" fill="none" stroke="#1b4ed8" stroke-width="4"/>
      <line x1="-80" y1="0" x2="80" y2="0" stroke="#1b4ed8" stroke-width="2"/>
      <line x1="0" y1="-120" x2="0" y2="120" stroke="#1b4ed8" stroke-width="2"/>
    </g>
  </g>
  
  <!-- Connection Lines -->
  <line x1="280" y1="400" x2="520" y2="400" stroke="#1b4ed8" stroke-width="2" stroke-dasharray="4 4" style="animation: sync 1s infinite alternate;"/>
</svg>
